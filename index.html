<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RetroPlay</title>
    
    <!-- Iconify -->
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
/* ===== RESET & VARIABLES ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: rgba(255, 255, 255, 0.04);
    --bg-card-hover: rgba(255, 255, 255, 0.08);
    --text-primary: #f0f0f5;
    --text-secondary: #8888a0;
    --text-muted: #5a5a6e;
    --accent: #6c5ce7;
    --accent-light: #a29bfe;
    --accent-dark: #4a3db8;
    --accent-glow: rgba(108, 92, 231, 0.25);
    --focus-glow: rgba(108, 92, 231, 0.4);
    --glass-bg: rgba(255, 255, 255, 0.06);
    --glass-border: rgba(255, 255, 255, 0.08);
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    --radius: 20px;
    --radius-sm: 12px;
    --transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    --transition-smooth: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.app-container {
    max-width: 1000px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg-primary);
    position: relative;
    overflow: hidden;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar {
    width: 0;
    height: 0;
}

/* ===== FOCUS VISIBLE ===== */
*:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 8px;
}

.carousel-item:focus-visible {
    outline: 2px solid var(--accent-light);
    outline-offset: 4px;
    box-shadow: 0 0 30px var(--focus-glow);
}

/* ===== MENU BUTTON ===== */
.menu-btn {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 9;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition);
}

.menu-btn:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent);
    color: var(--text-primary);
    transform: scale(1.05);
}

.menu-btn:active {
    transform: scale(0.92);
}

.menu-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

/* ===== STATUS WIDGET ===== */
.status-widget {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 9;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0,0,0,.3);
    border-radius: 24px;
    padding: 6px 14px 6px 16px;
    font-size: 12px;
    color: var(--text-secondary);
    user-select: none;
}

.status-widget .status-item {
    display: flex;
    align-items: center;
    gap: 4px;
}

.status-widget .status-divider {
    width: 1px;
    height: 18px;
    background: var(--glass-border);
}

.status-widget .clock {
    font-weight: 600;
    color: var(--text-primary);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    min-width: 55px;
    text-align: center;
}

.status-widget .clock .seconds {
    font-size: 9px;
    opacity: 0.4;
    font-weight: 400;
}

.status-widget .battery {
    display: flex;
    align-items: center;
    gap: 4px;
}

.status-widget .battery .percentage {
    font-size: 10px;
    font-weight: 500;
    min-width: 28px;
    text-align: right;
}

.status-widget .battery .battery-icon {
    transition: color 0.3s ease;
}

.status-widget .battery .battery-icon.low { color: #e74c3c; }
.status-widget .battery .battery-icon.medium { color: #f39c12; }
.status-widget .battery .battery-icon.high { color: #2ecc71; }
.status-widget .battery .battery-icon.charging {
    color: #2ecc71;
    animation: pulse 1s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.status-widget .connection .signal-bars {
    display: flex;
    align-items: flex-end;
    gap: 1.5px;
    height: 14px;
}

.status-widget .connection .signal-bars .bar {
    width: 3px;
    background: var(--text-muted);
    border-radius: 1px;
    transition: background 0.3s ease;
}

.status-widget .connection .signal-bars .bar.active {
    background: var(--accent-light);
}

.status-widget .connection .signal-bars .bar:nth-child(1) { height: 4px; }
.status-widget .connection .signal-bars .bar:nth-child(2) { height: 7px; }
.status-widget .connection .signal-bars .bar:nth-child(3) { height: 10px; }
.status-widget .connection .signal-bars .bar:nth-child(4) { height: 13px; }

.status-widget .connection .signal-bars .bar.inactive {
    opacity: 0.2;
}

.status-widget .connection .network-type {
    font-size: 9px;
    font-weight: 500;
    opacity: 0.6;
    min-width: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ===== FONDO DE LA VISTA HOME ===== */
.view-home {
    position: relative;
    overflow: hidden;
}

.view-home .view-bg {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    background-size: cover;
    background-position: center;
    opacity: 1;
    transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 0;
    pointer-events: none;
    will-change: transform, opacity;
}

.view-home .view-bg.has-image {
    opacity: 1;
    border-radius: 0;
    transform: scale(1);
}

.view-home .view-bg.active {
    opacity: 0.7;
    transform: scale(1);
}

.view-home .view-bg.has-image.active {
    opacity: 0.9;
    transform: scale(1);
}

/* ===== SLIDER SECTION ===== */
.slider-section {
    flex: 1;
    position: relative;
    z-index: 1;
    padding: 0 16px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
    overflow: visible;
}

/* ===== DEGRADADO INFERIOR ===== */
.slider-section::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60%;
    background: linear-gradient(to top, rgba(10, 10, 15, 0.9) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
}

/* ===== FOOTER ===== */
.home-footer {
    position: absolute;
    font-size: 15px;
    bottom: 20px;
    right: 24px;
    z-index: 11;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0.4;
    transition: opacity 0.3s ease;
}

.home-footer:hover {
    opacity: 0.8;
}

.home-footer .footer-icon {
    color: var(--text-muted);
}

.home-footer .footer-text {
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.3px;
}

/* ===== INDICADORES ===== */
.indicators-top {
    display: none;
    justify-content: center;
    gap: 6px;
    z-index: 2;
    padding: 8px 0 12px;
    flex-shrink: 0;
}

.indicator {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: all var(--transition);
    cursor: pointer;
    border: none;
    padding: 0;
}

.indicator:hover {
    background: var(--text-secondary);
    transform: scale(1.2);
}

.indicator.active {
    width: 24px;
    border-radius: 4px;
    background: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
}

.indicator:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

/* ===== CARRUSEL ===== */
.carousel-container {
    position: relative;
    z-index: 1;
    overflow: visible;
    padding:0;
    width:100%;
    flex-shrink: 0;
}

.carousel-track {
    display: flex;
    gap: 15px;
    transition: transform var(--transition-smooth);
    padding: 0 10px;
    will-change: transform;
    align-items: center;
}

.carousel-item {
    flex: 0 0 140px;
    height: 120px;
    background: transparent;
    border: none;
    backdrop-filter: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition);
    position: relative;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
}

.emulator-image-wrapper {
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
    background: transparent !important;
}

.emulator-logo-bg {
    width: 100%;
    height: 100%;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    z-index: 1;
}

.emulator-logo-bg.no-logo {
    background: none !important;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    text-align: center;
    letter-spacing: 0.3px;
    line-height: 1.2;
    max-width: 100px;
    word-wrap: break-word;
}

.carousel-item .emulator-name,
.carousel-item .emulator-year {
    display: none;
}

.carousel-item.active .emulator-logo-bg {
    animation: float 1s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: scale(1.6) translateY(0px); }
    50% { transform: scale(1.6) translateY(-6px); }
}

/* ===== INFO CARD ===== */
.info-card {
    position: relative;
    z-index: 2;
    max-width:600px;
    padding: 0px 20px;
    margin-top: 0;
    display: flex;
    gap: 14px;
    align-items: center;
    transition: all 0.5s ease;
    flex-shrink: 0;
    animation: slideUp 0.6s ease-out;
    cursor: default;
}

.info-content {
    flex: 1;
    min-width: 0;
}

.info-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 2px;
}

.system-title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.3px;
    transition: all 0.3s;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
}

.system-year {
    font-size: 10px;
    color: var(--text-primary);
    opacity: .6;
    font-weight: 500;
    background: var(--bg-card);
    padding: 0 10px;
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    flex-shrink: 0;
}

.system-desc {
    font-size: 10px;
    color: var(--text-primary);
    opacity: .6;
    line-height: 1.4;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.system-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 6px;
}

.tag {
    font-size: 8px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 20px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: var(--text-primary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.system-core {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
}

.core-label {
    color: var(--text-primary);
    font-weight: 500;
}

.core-value {
    color: var(--accent-light);
    font-weight: 600;
    background: rgba(108, 92, 231, 0.15);
    padding: 1px 10px;
    border-radius: 12px;
    border: 1px solid rgba(108, 92, 231, 0.2);
}

.controller-container {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    padding: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
}

.controller-wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.controller-icon {
    color: var(--text-primary);
    filter: drop-shadow(0 4px 20px rgba(108, 92, 231, 0.2));
    transition: all 0.5s ease;
}

/* ===== VISTAS (Home / Settings / Games) ===== */
.view {
    display: none;
    flex: 1;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    position: relative;
}

.view.active {
    display: flex;
}

/* ===== VIEW: GAMES ===== */
.view-games {
    background: var(--bg-primary);
    padding: 0 16px 30px;
    overflow-y: auto;
}

.view-games .games-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0 12px;
    border-bottom: 1px solid var(--glass-border);
    flex-shrink: 0;
    position: sticky;
    top: 0;
    background: var(--bg-primary);
    z-index: 10;
}

.view-games .games-header h2 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
}

.view-games .games-header h2 .game-count {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
    opacity: 0.6;
}

.view-games .games-back {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: var(--text-secondary);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition);
}

.view-games .games-back:hover {
    background: var(--bg-card-hover);
    color: var(--text-primary);
}

/* ===== GAMES GRID ===== */
.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
    padding: 16px 0;
}

.game-card {
    background: var(--bg-card);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    transition: all var(--transition);
    cursor: pointer;
    position: relative;
}

.game-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}

.game-card .game-cover-wrapper {
    width: 100%;
    aspect-ratio: 1/1.2;
    background: var(--bg-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.game-card .game-cover-wrapper .game-cover {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: all var(--transition);
}

.game-card .game-cover-wrapper .game-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    background: var(--bg-secondary);
    gap: 6px;
}

.game-card .game-cover-wrapper .game-fallback iconify-icon {
    opacity: 0.4;
}

.game-card .game-cover-wrapper .game-fallback span {
    font-size: 10px;
    opacity: 0.4;
    font-weight: 500;
    text-align: center;
    padding: 0 8px;
    word-break: break-all;
}

.game-card .game-info {
    padding: 10px 12px 12px;
}

.game-card .game-info .game-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.game-card .game-info .game-meta {
    display: flex;
    gap: 8px;
    margin-top: 4px;
    font-size: 10px;
    color: var(--text-muted);
    opacity: 0.6;
    flex-wrap: wrap;
}

.game-card .game-info .game-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
}

.game-card .game-info .game-actions .btn-game {
    padding: 4px 12px;
    border: none;
    border-radius: 14px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 4px;
}

.game-card .game-info .game-actions .btn-game.download {
    background: var(--accent);
    color: white;
}

.game-card .game-info .game-actions .btn-game.download:hover {
    background: var(--accent-dark);
    transform: scale(1.05);
}

.game-card .game-info .game-actions .btn-game.play {
    background: #2ecc71;
    color: white;
}

.game-card .game-info .game-actions .btn-game.play:hover {
    background: #27ae60;
    transform: scale(1.05);
}

.game-card .game-info .game-actions .btn-game.disabled {
    background: var(--bg-card);
    color: var(--text-muted);
    border: 1px solid var(--glass-border);
    cursor: default;
    pointer-events: none;
}

/* ===== MODAL DE EDICIÓN ===== */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-overlay.open {
    display: flex;
}

.modal-content {
    background: var(--bg-secondary);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    max-width: 400px;
    width: 100%;
    padding: 24px;
    animation: slideUp 0.3s ease;
    max-height: 90vh;
    overflow-y: auto;
}

.modal-content .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--glass-border);
}

.modal-content .modal-header h3 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
}

.modal-content .modal-header .modal-close {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: var(--text-secondary);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition);
}

.modal-content .modal-header .modal-close:hover {
    background: var(--bg-card-hover);
    color: var(--text-primary);
    transform: rotate(90deg);
}

.modal-content .modal-field {
    margin-bottom: 12px;
}

.modal-content .modal-field label {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.modal-content .modal-field input,
.modal-content .modal-field textarea {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-size: 13px;
    font-family: inherit;
    transition: all var(--transition);
}

.modal-content .modal-field input:focus,
.modal-content .modal-field textarea:focus {
    outline: none;
    border-color: var(--accent);
}

.modal-content .modal-field textarea {
    resize: vertical;
    min-height: 60px;
}

.modal-content .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--glass-border);
    flex-wrap: wrap;
}

.modal-content .modal-actions .btn-modal {
    padding: 8px 16px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    flex: 1;
    min-width: 80px;
}

.modal-content .modal-actions .btn-modal.save {
    background: var(--accent);
    color: white;
}

.modal-content .modal-actions .btn-modal.save:hover {
    background: var(--accent-dark);
    transform: scale(1.02);
}

.modal-content .modal-actions .btn-modal.delete {
    background: rgba(231, 76, 60, 0.15);
    color: #e74c3c;
    border: 1px solid rgba(231, 76, 60, 0.2);
}

.modal-content .modal-actions .btn-modal.delete:hover {
    background: rgba(231, 76, 60, 0.25);
    transform: scale(1.02);
}

.modal-content .modal-actions .btn-modal.scrape {
    background: var(--bg-card);
    color: var(--text-secondary);
    border: 1px solid var(--glass-border);
}

.modal-content .modal-actions .btn-modal.scrape:hover {
    background: var(--bg-card-hover);
    transform: scale(1.02);
}

/* ===== SETTINGS VIEW ===== */
.view-settings {
    background: var(--bg-primary);
    padding: 0 20px 30px;
    overflow-y: auto;
}

.view-settings .settings-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0 16px;
    border-bottom: 1px solid var(--glass-border);
    flex-shrink: 0;
    position: sticky;
    top: 0;
    background: var(--bg-primary);
    z-index: 10;
}

.view-settings .settings-header h2 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
}

.view-settings .settings-back {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: var(--text-secondary);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition);
}

.view-settings .settings-back:hover {
    background: var(--bg-card-hover);
    color: var(--text-primary);
}

/* ===== ACORDEONES ===== */
.accordion {
    margin-bottom: 16px;
}

.accordion-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: var(--bg-card);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all var(--transition);
    user-select: none;
}

.accordion-header:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent);
}

.accordion-header .accordion-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
}

.accordion-header .accordion-icon {
    transition: transform 0.3s ease;
    color: var(--text-muted);
}

.accordion-header.open .accordion-icon {
    transform: rotate(180deg);
}

.accordion-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    padding: 0 4px;
}

.accordion-body.open {
    max-height: 800px;
    padding: 12px 4px;
}

/* ===== CHECKBOX LIST ===== */
.checkbox-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 300px;
    overflow-y: auto;
    padding-right: 4px;
}

.checkbox-list::-webkit-scrollbar {
    width: 3px;
}

.checkbox-list::-webkit-scrollbar-track {
    background: var(--bg-card);
    border-radius: 4px;
}

.checkbox-list::-webkit-scrollbar-thumb {
    background: var(--accent);
    border-radius: 4px;
}

.checkbox-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all var(--transition);
}

.checkbox-item:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent);
}

.checkbox-item input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border: 2px solid var(--text-muted);
    border-radius: 6px;
    flex-shrink: 0;
    cursor: pointer;
    transition: all var(--transition);
    position: relative;
}

.checkbox-item input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
}

.checkbox-item input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 14px;
    font-weight: 700;
}

.checkbox-item input[type="checkbox"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.checkbox-item .checkbox-label {
    flex: 1;
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
}

.checkbox-item .checkbox-badge {
    font-size: 10px;
    color: var(--text-muted);
    background: var(--glass-bg);
    padding: 2px 10px;
    border-radius: 12px;
    border: 1px solid var(--glass-border);
}

.checkbox-item .checkbox-status {
    font-size: 10px;
    color: var(--accent-light);
    font-weight: 600;
}

/* ===== COLOR THEMES ===== */
.color-themes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.color-theme-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 8px;
    background: var(--bg-card);
    border: 2px solid var(--glass-border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all var(--transition);
}

.color-theme-btn:hover {
    background: var(--bg-card-hover);
    transform: translateY(-2px);
}

.color-theme-btn.active {
    border-color: var(--accent);
    background: rgba(108, 92, 231, 0.1);
    box-shadow: 0 0 20px var(--accent-glow);
}

.color-theme-btn .color-preview {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all var(--transition);
}

.color-theme-btn .color-preview .check {
    opacity: 0;
    transition: all var(--transition);
}

.color-theme-btn.active .color-preview .check {
    opacity: 1;
}

.color-theme-btn .color-name {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 500;
}

.color-theme-btn.active .color-name {
    color: var(--text-secondary);
}

/* ===== EMULADORES LIST ===== */
.emulator-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.emulator-item {
    display: flex;
    flex-direction: column;
    padding: 12px 16px;
    background: var(--bg-card);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    transition: all var(--transition);
    gap: 8px;
}

.emulator-item:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent);
}

.emulator-item .emulator-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.emulator-item .emulator-info {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
}

.emulator-item .emulator-info .emulator-icon {
    flex-shrink: 0;
    color: var(--text-muted);
}

.emulator-item .emulator-info .emulator-details {
    flex: 1;
    min-width: 0;
}

.emulator-item .emulator-info .emulator-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.emulator-item .emulator-info .emulator-name .status-badge {
    font-size: 9px;
    padding: 1px 8px;
    border-radius: 12px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    white-space: nowrap;
}

.emulator-item .emulator-info .emulator-name .status-badge.installed {
    background: #2ecc71;
}

.emulator-item .emulator-info .emulator-name .status-badge.not-installed {
    background: var(--text-muted);
}

.emulator-item .emulator-info .emulator-name .version-tag {
    font-size: 9px;
    color: var(--accent-light);
    font-weight: 400;
}

.emulator-item .emulator-info .emulator-pkg {
    font-size: 10px;
    color: var(--text-muted);
    opacity: 0.5;
    font-family: monospace;
}

.emulator-item .emulator-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.btn-action {
    padding: 5px 12px;
    border: none;
    border-radius: 16px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    min-height: 28px;
}

.btn-action:hover {
    transform: scale(1.05);
}

.btn-action:active {
    transform: scale(0.95);
}

.btn-action.open {
    background: var(--accent);
    color: white;
}

.btn-action.open:hover {
    background: var(--accent-dark);
}

.btn-action.download {
    background: var(--accent);
    color: white;
}

.btn-action.download:hover {
    background: var(--accent-dark);
}

.btn-action.uninstall {
    background: var(--bg-card);
    color: var(--text-muted);
    border: 1px solid var(--glass-border);
}

.btn-action.uninstall:hover {
    background: rgba(231, 76, 60, 0.2);
    border-color: #e74c3c;
    color: #e74c3c;
}

.btn-action.loading {
    opacity: 0.6;
    pointer-events: none;
}

/* ===== LISTAS DE JUEGOS ===== */
.listas-config {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.listas-config .folder-selector {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.listas-config .folder-selector input[type="file"] {
    display: none;
}

.listas-config .folder-selector .btn-folder {
    padding: 10px 16px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}

.listas-config .folder-selector .btn-folder:hover {
    background: var(--accent-dark);
    transform: scale(1.02);
}

.listas-config .folder-selector .btn-folder:active {
    transform: scale(0.98);
}

.listas-config .folder-path {
    font-size: 12px;
    color: var(--text-muted);
    padding: 8px 4px;
    word-break: break-all;
    font-family: monospace;
    opacity: 0.6;
}

.listas-config .folder-path .path-label {
    opacity: 0.4;
}

.listas-config .lista-info {
    font-size: 12px;
    color: var(--text-muted);
    padding: 4px 4px;
}

.listas-config .lista-info .count {
    color: var(--accent-light);
    font-weight: 600;
}

.listas-grid {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 200px;
    overflow-y: auto;
    padding: 4px 2px;
}

.listas-grid .lista-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    background: var(--bg-card);
    border: 1px solid var(--glass-border);
    border-radius: 6px;
    font-size: 12px;
    color: var(--text-secondary);
    transition: all var(--transition);
    cursor: pointer;
}

.listas-grid .lista-item:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent);
}

.listas-grid .lista-item .lista-name {
    flex: 1;
    font-family: monospace;
    font-size: 11px;
}

.listas-grid .lista-item .lista-games {
    font-size: 10px;
    color: var(--accent-light);
    font-weight: 500;
}

/* ===== BOTÓN GUARDAR ===== */
.settings-actions {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--glass-border);
    padding-bottom: 20px;
}

.btn-save {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-save:hover {
    background: var(--accent-dark);
    transform: scale(1.02);
}

.btn-save:active {
    transform: scale(0.98);
}

.btn-save:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.btn-reset {
    padding: 12px 20px;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    background: var(--glass-bg);
    color: var(--text-secondary);
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    transition: all var(--transition);
}

.btn-reset:hover {
    background: var(--bg-card-hover);
    color: var(--text-primary);
}

.btn-reset:active {
    transform: scale(0.98);
}

/* ===== TOAST ===== */
.toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-secondary);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    padding: 12px 24px;
    color: var(--text-primary);
    font-size: 14px;
    z-index: 300;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    backdrop-filter: blur(20px);
    box-shadow: var(--shadow);
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.toast iconify-icon {
    margin-right: 8px;
}

/* ===== ANIMACIONES ===== */
@keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* ===== ESTADO DE CARGA ===== */
.app-container.loading .carousel-item,
.app-container.loading .info-card {
    opacity: 0.5;
    pointer-events: none;
}

.app-container.loading::after {
    content: 'Cargando...';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    z-index: 100;
    background: var(--bg-card);
    padding: 16px 32px;
    border-radius: var(--radius);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 380px) {
    .carousel-item {
        flex: 0 0 116px;
        height: 150px;
    }
    .emulator-image-wrapper {
        width: 44px;
        height: 44px;
    }
    .system-title { font-size: 15px; }
    .controller-container {
        width: 60px;
        height: 60px;
    }
    .controller-icon {
        width: 44px !important;
        height: 44px !important;
    }
    .color-themes {
        grid-template-columns: repeat(3, 1fr);
    }
    .status-widget {
        padding: 4px 10px 4px 12px;
        font-size: 10px;
        gap: 8px;
    }
    .status-widget .clock {
        font-size: 11px;
        min-width: 45px;
    }
    .status-widget .battery .percentage {
        font-size: 9px;
        min-width: 22px;
    }
    .emulator-item .emulator-top {
        flex-wrap: wrap;
    }
    .emulator-item .emulator-actions {
        width: 100%;
        justify-content: flex-start;
    }
    .emulator-item .emulator-info .emulator-name {
        font-size: 12px;
    }
    .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 12px;
    }
}

@media (min-width: 431px) {
    .app-container {
        border-left: 1px solid var(--glass-border);
        border-right: 1px solid var(--glass-border);
    }
}

// ===== EMULADOR MANAGER =====
class EmulatorManager {
    constructor() {
        this.cache = new Map();
        this.simulation = true;
        this.simulatedInstalled = [
            'com.dsemu.drastic',
            'com.retroarch',
            'org.ppsspp.ppsspp',
            'com.github.uoyouchen.eightynine',
            'com.mame4droid',
            'com.epsxe',
            'com.fpse',
            'com.mupen64plusae'
        ];
        this.simulatedVersions = {
            'com.dsemu.drastic': '2.5.1',
            'com.retroarch': '1.16.0',
            'org.ppsspp.ppsspp': '1.17.1',
            'com.github.uoyouchen.eightynine': '2.1.0',
            'com.mame4droid': '1.0.0',
            'com.epsxe': '1.0.0',
            'com.fpse': '1.0.0',
            'com.mupen64plusae': '1.0.0'
        };
    }

    async isInstalled(packageName) {
        if (this.cache.has(packageName)) return this.cache.get(packageName);
        let installed = false;
        if (window.AndroidBridge && typeof window.AndroidBridge.isAppInstalled === 'function') {
            try { installed = await window.AndroidBridge.isAppInstalled(packageName); } catch (e) {}
        }
        if (!installed && this.simulation) {
            installed = this.simulatedInstalled.includes(packageName);
        }
        this.cache.set(packageName, installed);
        setTimeout(() => this.cache.delete(packageName), 300000);
        return installed;
    }

    async getVersion(packageName) {
        let version = null;
        if (window.AndroidBridge && typeof window.AndroidBridge.getAppVersion === 'function') {
            try { version = await window.AndroidBridge.getAppVersion(packageName); } catch (e) {}
        }
        if (!version && this.simulation) {
            version = this.simulatedVersions[packageName] || null;
        }
        return version;
    }

    async launch(packageName, activity) {
        let launched = false;
        if (window.AndroidBridge && typeof window.AndroidBridge.launchApp === 'function') {
            try { launched = await window.AndroidBridge.launchApp(packageName, activity); } catch (e) {}
        }
        if (!launched) {
            try {
                const activityPath = activity || `${packageName}.MainActivity`;
                const intentUrl = `intent://${activityPath}#Intent;package=${packageName};end`;
                window.location.href = intentUrl;
                launched = true;
            } catch (e) {}
        }
        return launched;
    }

    async uninstall(packageName) {
        let uninstalled = false;
        if (window.AndroidBridge && typeof window.AndroidBridge.uninstallApp === 'function') {
            try {
                uninstalled = await window.AndroidBridge.uninstallApp(packageName);
                if (uninstalled) this.cache.delete(packageName);
            } catch (e) {}
        }
        if (!uninstalled) {
            const intentUrl = `intent://#Intent;action=android.settings.APPLICATION_DETAILS_SETTINGS;data=package:${packageName};end`;
            window.location.href = intentUrl;
            uninstalled = true;
        }
        return uninstalled;
    }
}

folderInput.addEventListener('change', async function(e) {
    const files = e.target.files;
    if (!files || files.length === 0) return;
    
    const firstFile = files[0];
    const path = firstFile.webkitRelativePath || firstFile.name;
    const folderName = path.split('/')[0];
    
    folderPathText.textContent = folderName;
    selectedFolder = folderName;
    
    showToast(`Carpeta seleccionada: ${folderName}`, 'mdi:folder-open');
    
    const txtFiles = [];
    for (const file of files) {
        if (file.name.endsWith('.txt') && file.webkitRelativePath) {
            txtFiles.push(file);
        }
    }
    
    if (txtFiles.length === 0) {
        showToast('No se encontraron archivos .txt en la carpeta', 'mdi:alert');
        listasData = [];
        renderListas();
        return;
    }
    
    const results = [];
    for (const file of txtFiles) {
        try {
            const text = await file.text();
            const lines = text.split('\n').filter(line => line.trim());
            const games = lines.map(line => {
                const parts = line.split('=');
                return {
                    name: parts[0] || 'Desconocido',
                    url: parts[1] || '',
                    system: parts[2] || 'desconocido',
                    size: parts[3] || 'N/A'
                };
            });
            
            results.push({
                name: file.name,
                games: games.length,
                gamesData: games,
                size: `${(file.size / 1024).toFixed(1)} KB`
            });
        } catch (error) {
            console.error('Error leyendo archivo:', file.name, error);
        }
    }
    
    listasData = results;
    renderListas();
    
    localStorage.setItem('retroplay-folder', folderName);
    localStorage.setItem('retroplay-listas', JSON.stringify(results));
    
    showToast(`Encontrados ${results.length} archivos de lista`, 'mdi:check-circle');
});

// ===== EXTRACCIÓN DE TAGS =====
function extractTags(description) {
    const tags = [];
    const keywords = {
        '3D': ['3D', 'tridimensional', 'polígonos'],
        '2D': ['2D', 'bidimensional', 'sprites'],
        'Portátil': ['portátil', 'handheld', 'móvil'],
        'CD': ['CD', 'disco', 'óptico'],
        'Arcade': ['arcade', 'recreativa'],
        'Clásico': ['clásico', 'retro', 'legendario'],
        'RPG': ['RPG', 'role', 'aventura'],
        'Lucha': ['lucha', 'fighting', 'pelea']
    };
    
    const descLower = description.toLowerCase();
    for (const [tag, words] of Object.entries(keywords)) {
        if (words.some(w => descLower.includes(w.toLowerCase()))) {
            tags.push(tag);
        }
    }
    
    if (tags.length === 0) {
        tags.push('Retro');
        if (descLower.includes('videojuego') || descLower.includes('juego')) {
            tags.push('Videojuego');
        }
    }
    return tags.slice(0, 4);
}

// ===== PROCESAR EMULADORES =====
function processEmulators(rawData) {
    const processed = rawData.map(item => {
        const yearMatch = item.descripcion.match(/\b(19[8-9][0-9]|20[0-2][0-9])\b/);
        const colors = getSystemColors(item.system);
        const isRetroArch = RETROARCH_CORES.includes(item.system);
        return {
            id: item.system,
            name: item.nombre,
            icon: getIconForSystem(item.system),
            iconController: getControllerIconForSystem(item.system),
            year: yearMatch ? yearMatch[0] : 'N/A',
            description: item.descripcion,
            coreDef: item.coreDef || 'Desconocido',
            coreOpciones: item.coreOpciones || [item.coreDef || 'Desconocido'],
            tags: extractTags(item.descripcion),
            bgColor: colors.bg,
            accentColor: colors.accent,
            imagePath: `${CONFIG.assetsPath}${item.system}.webp`,
            fondoPath: `${CONFIG.fondosPath}${item.system}.webp`,
            isRetroArch: isRetroArch,
            visible: isRetroArch,
            listaName: SYSTEM_LIST_MAP[item.system] || item.system
        };
    });
    
    return processed.sort((a, b) => a.name.localeCompare(b.name));
}

        preview.innerHTML = `<iconify-icon icon="mdi:check" width="16" height="16" class="check" style="color:white;"></iconify-icon>`;
        
        const name = document.createElement('span');
        name.className = 'color-name';
        name.textContent = theme.name;
        
        btn.appendChild(preview);
        btn.appendChild(name);
        
        btn.addEventListener('click', () => {
            applyTheme(theme.id);
            renderColorThemes();
            hasUnsavedChanges = true;
        });
        
        colorThemes.appendChild(btn);
    });
}

// ===== RENDER EMULADORES =====
async function renderEmuladores() {
    emulatorList.innerHTML = '';
    
    if (!emuladoresData || emuladoresData.length === 0) {
        emulatorList.innerHTML = `
            <div style="text-align:center; padding:20px; color:var(--text-muted); font-size:13px;">
                <iconify-icon icon="mdi:information" width="24" height="24" style="display:block; margin:0 auto 8px; opacity:0.3;"></iconify-icon>
                No hay emuladores disponibles
            </div>
        `;
        emulatorCount.textContent = '0';
        return;
    }

    emulatorCount.textContent = emuladoresData.length;

    emulatorList.innerHTML = `
        <div style="text-align:center; padding:20px; color:var(--text-muted); font-size:13px;">
            <iconify-icon icon="mdi:loading" width="24" height="24" style="display:block; margin:0 auto 8px; animation: spin 1s linear infinite;"></iconify-icon>
            Verificando emuladores...
        </div>
    `;

    const results = [];
    for (const emu of emuladoresData) {
        const installed = await emulatorManager.isInstalled(emu.pkg);
        const version = installed ? await emulatorManager.getVersion(emu.pkg) : null;
        results.push({ ...emu, installed, version });
    }

    emulatorList.innerHTML = '';
    results.forEach(emu => {
        const item = document.createElement('div');
        item.className = 'emulator-item';
        
        const top = document.createElement('div');
        top.className = 'emulator-top';
        
        const info = document.createElement('div');
        info.className = 'emulator-info';
        
        const icon = document.createElement('span');
        icon.className = 'emulator-icon';
        icon.innerHTML = `<iconify-icon icon="mdi:application" width="20" height="20"></iconify-icon>`;
        
        const details = document.createElement('div');
        details.className = 'emulator-details';
        
        const nameDiv = document.createElement('div');
        nameDiv.className = 'emulator-name';
        nameDiv.innerHTML = `
            ${emu.nombre}
            ${emu.installed ? 
                `<span class="status-badge installed">✓ Instalado</span>` : 
                `<span class="status-badge not-installed">No instalado</span>`
            }
            ${emu.installed && emu.version ? `<span class="version-tag">v${emu.version}</span>` : ''}
        `;
        
        const pkgDiv = document.createElement('div');
        pkgDiv.className = 'emulator-pkg';
        pkgDiv.textContent = emu.pkg || '';
        
        details.appendChild(nameDiv);
        details.appendChild(pkgDiv);
        
        info.appendChild(icon);
        info.appendChild(details);
        
        const actions = document.createElement('div');
        actions.className = 'emulator-actions';
        
        if (emu.installed) {
            const openBtn = document.createElement('button');
            openBtn.className = 'btn-action open';
            openBtn.innerHTML = `<iconify-icon icon="mdi:play" width="14" height="14"></iconify-icon> Abrir`;
            openBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                openBtn.classList.add('loading');
                const launched = await emulatorManager.launch(emu.pkg, emu.atv);
                openBtn.classList.remove('loading');
                if (launched) {
                    showToast(`Abriendo ${emu.nombre}...`, 'mdi:play');
                } else {
                    showToast('No se pudo abrir el emulador', 'mdi:alert');
                }
            });
            actions.appendChild(openBtn);
            
            const uninstallBtn = document.createElement('button');
            uninstallBtn.className = 'btn-action uninstall';
            uninstallBtn.innerHTML = `<iconify-icon icon="mdi:delete" width="14" height="14"></iconify-icon>`;
            uninstallBtn.title = 'Desinstalar';
            uninstallBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (confirm(`¿Desinstalar ${emu.nombre}?`)) {
                    uninstallBtn.classList.add('loading');
                    const uninstalled = await emulatorManager.uninstall(emu.pkg);
                    uninstallBtn.classList.remove('loading');
                    if (uninstalled) {
                        showToast(`Desinstalando ${emu.nombre}...`, 'mdi:delete');
                        renderEmuladores();
                    }
                }
            });
            actions.appendChild(uninstallBtn);
        } else {
            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'btn-action download';
            downloadBtn.innerHTML = `<iconify-icon icon="mdi:download" width="14" height="14"></iconify-icon> Descargar`;
            downloadBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (emu.url) {
                    window.open(emu.url, '_blank');
                    showToast(`Descargando ${emu.nombre}...`, 'mdi:download');
                } else {
                    showToast('No hay enlace de descarga disponible', 'mdi:alert');
                }
            });
            actions.appendChild(downloadBtn);
        }
        
        top.appendChild(info);
        top.appendChild(actions);
        item.appendChild(top);
        emulatorList.appendChild(item);
    });
}

// ===== OBTENER JUEGOS PARA UN SISTEMA (DESDE LISTAS REALES) =====
function getGamesForSystem(systemId, listaName) {
    // Buscar en las listas escaneadas
    const systemKey = systemId.toLowerCase();
    const listaKey = listaName || systemKey;
    
    // Primero buscar por nombre de lista exacto
    for (const lista of listasData) {
        const listaBase = lista.name.replace('.txt', '').toLowerCase();
        if (listaBase === listaKey || listaBase === systemKey || lista.name.toLowerCase().includes(systemKey)) {
            if (lista.gamesData && lista.gamesData.length > 0) {
                return lista.gamesData.map(g => ({
                    name: g.name,
                    year: 'N/A',
                    size: g.size || 'N/A',
                    cover: null,
                    system: g.system || systemKey,
                    url: g.url || ''
                }));
            }
        }
    }
    
    // Si no hay listas, buscar por nombre del sistema en los nombres de lista
    for (const lista of listasData) {
        if (lista.gamesData && lista.gamesData.length > 0) {
            // Si la lista contiene juegos que coinciden con el sistema
            const hasSystemGame = lista.gamesData.some(g => 
                g.system && g.system.toLowerCase() === systemKey
            );
            if (hasSystemGame || lista.name.toLowerCase().includes(systemKey)) {
                return lista.gamesData.map(g => ({
                    name: g.name,
                    year: 'N/A',
                    size: g.size || 'N/A',
                    cover: null,
                    system: g.system || systemKey,
                    url: g.url || ''
                }));
            }
        }
    }
    
    // Si no hay listas, devolver array vacío
    return [];
}

// ===== MOSTRAR LISTA DE JUEGOS =====
function showGamesList(games, systemName) {
    gamesGrid.innerHTML = '';
    currentSystemGames = games || [];
    currentListaName = systemName || 'Juegos';
    
    gamesTitle.textContent = currentListaName;
    gamesCount.textContent = `(${games ? games.length : 0})`;
    isGameViewOpen = true;
    
    if (!games || games.length === 0) {
        gamesGrid.innerHTML = `
            <div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-muted);">
                <iconify-icon icon="mdi:gamepad" width="48" height="48" style="display:block; margin:0 auto 12px; opacity:0.3;"></iconify-icon>
                <p style="font-size:14px;">No hay juegos disponibles para este sistema</p>
                <p style="font-size:12px; opacity:0.5;">Asegúrate de tener una lista con el nombre del sistema</p>
            </div>
        `;
    }
    
    games.forEach((game, index) => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.style.animationDelay = `${index * 0.05}s`;
        card.dataset.index = index;
        
        const coverWrapper = document.createElement('div');
        coverWrapper.className = 'game-cover-wrapper';
        
        const fallback = document.createElement('div');
        fallback.className = 'game-fallback';
        fallback.innerHTML = `
            <iconify-icon icon="mdi:gamepad-variant" width="32" height="32"></iconify-icon>
            <span>${game.name.substring(0, 3).toUpperCase()}</span>
        `;
        coverWrapper.appendChild(fallback);
        
        const info = document.createElement('div');
        info.className = 'game-info';
        info.innerHTML = `
            <div class="game-name">${game.name}</div>
            <div class="game-meta">
                <span class="game-system">${game.system || 'Retro'}</span>
                <span>•</span>
                <span class="game-size">${game.size || 'N/A'}</span>
            </div>
            <div class="game-actions">
                <button class="btn-game download" data-index="${index}">
                    <iconify-icon icon="mdi:download" width="14" height="14"></iconify-icon>
                    Descargar
                </button>
                <button class="btn-game play disabled" data-index="${index}">
                    <iconify-icon icon="mdi:play" width="14" height="14"></iconify-icon>
                    Jugar
                </button>
            </div>
        `;
        
        card.appendChild(coverWrapper);
        card.appendChild(info);
        
        // Click en la card para lanzar juego (si está descargado)
        card.addEventListener('click', (e) => {
            if (e.target.closest('.btn-game') || e.target.closest('.game-actions')) return;
            const playBtn = card.querySelector('.btn-game.play');
            if (playBtn && !playBtn.classList.contains('disabled')) {
                showToast(`Lanzando ${game.name}...`, 'mdi:play');
                console.log('🎮 Lanzando juego:', game);
            } else {
                showToast(`Descarga primero ${game.name}`, 'mdi:download');
            }
        });
        
        // Click en botón descargar
        const downloadBtn = card.querySelector('.btn-game.download');
        downloadBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (game.url) {
                window.open(game.url, '_blank');
                showToast(`Descargando ${game.name}...`, 'mdi:download');
                // Marcar como descargado (simulación)
                downloadBtn.classList.remove('download');
                downloadBtn.classList.add('play');
                downloadBtn.innerHTML = `<iconify-icon icon="mdi:check" width="14" height="14"></iconify-icon> Descargado`;
                const playBtn = card.querySelector('.btn-game.play');
                if (playBtn) {
                    playBtn.classList.remove('disabled');
                    playBtn.classList.add('play');
                    playBtn.innerHTML = `<iconify-icon icon="mdi:play" width="14" height="14"></iconify-icon> Jugar`;
                }
                // Guardar estado de descarga
                game.downloaded = true;
            } else {
                showToast('No hay enlace de descarga disponible', 'mdi:alert');
            }
        });
        
        // Click en botón jugar (si está habilitado)
        const playBtn = card.querySelector('.btn-game.play');
        if (!playBtn.classList.contains('disabled')) {
            playBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                showToast(`Lanzando ${game.name}...`, 'mdi:play');
                console.log('🎮 Jugando:', game);
            });
        }
        
        // Click largo para abrir modal
        let longPressTimer = null;
        card.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            longPressTimer = setTimeout(() => {
                openGameModal(index);
            }, 600);
        });
        card.addEventListener('mouseup', () => {
            clearTimeout(longPressTimer);
        });
        card.addEventListener('mouseleave', () => {
            clearTimeout(longPressTimer);
        });
        // Touch
        card.addEventListener('touchstart', (e) => {
            longPressTimer = setTimeout(() => {
                openGameModal(index);
            }, 600);
        });
        card.addEventListener('touchend', () => {
            clearTimeout(longPressTimer);
        });
        card.addEventListener('touchmove', () => {
            clearTimeout(longPressTimer);
        });
        
        gamesGrid.appendChild(card);
    });
    
    viewHome.classList.remove('active');
    viewSettings.classList.remove('active');
    viewGames.classList.add('active');
}

// ===== MODAL DE EDICIÓN =====
function openGameModal(index) {
    const game = currentSystemGames[index];
    if (!game) return;
    
    selectedGameIndex = index;
    modalTitle.textContent = `Editar: ${game.name}`;
    modalGameName.value = game.name || '';
    modalGameDesc.value = game.descripcion || '';
    modalGameUrl.value = game.url || '';
    modalOverlay.classList.add('open');
}

function closeGameModal() {
    modalOverlay.classList.remove('open');
    selectedGameIndex = -1;
}

// Guardar cambios del modal
modalSave.addEventListener('click', () => {
    if (selectedGameIndex < 0 || selectedGameIndex >= currentSystemGames.length) return;
    
    const game = currentSystemGames[selectedGameIndex];
    game.name = modalGameName.value || game.name;
    game.descripcion = modalGameDesc.value || '';
    game.url = modalGameUrl.value || game.url;
    
    // Actualizar la card
    const cards = gamesGrid.querySelectorAll('.game-card');
    if (cards[selectedGameIndex]) {
        const card = cards[selectedGameIndex];
        const nameEl = card.querySelector('.game-name');
        if (nameEl) nameEl.textContent = game.name;
        const fallback = card.querySelector('.game-fallback span');
        if (fallback) fallback.textContent = game.name.substring(0, 3).toUpperCase();
    }
    
    showToast('Juego actualizado', 'mdi:check-circle');
    closeGameModal();
});

// Eliminar juego
modalDelete.addEventListener('click', () => {
    if (selectedGameIndex < 0 || selectedGameIndex >= currentSystemGames.length) return;
    if (!confirm('¿Eliminar este juego de la lista?')) return;
    
    currentSystemGames.splice(selectedGameIndex, 1);
    closeGameModal();
    // Re-renderizar
    showGamesList(currentSystemGames, currentListaName);
    showToast('Juego eliminado', 'mdi:delete');
});

// Scrapear (simulación)
modalScrape.addEventListener('click', () => {
    if (selectedGameIndex < 0 || selectedGameIndex >= currentSystemGames.length) return;
    const game = currentSystemGames[selectedGameIndex];
    showToast(`Buscando información de ${game.name}...`, 'mdi:web');
    // Simulación de scrape
    setTimeout(() => {
        modalGameDesc.value = `Juego clásico de ${game.system || 'Retro'}. Enlace: ${game.url || 'No disponible'}`;
        showToast('Información encontrada', 'mdi:check-circle');
    }, 1500);
});

// Cerrar modal
modalClose.addEventListener('click', closeGameModal);
modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeGameModal();
});

// ===== FILTRAR Y RENDERIZAR =====
function filterAndRender() {
    filteredEmulators = emulators.filter(emu => emu.visible !== false);
    
    if (filteredEmulators.length === 0) {
        track.innerHTML = `
            <div style="width:100%; text-align:center; padding:40px 0; color:var(--text-muted);">
                <iconify-icon icon="mdi:information" width="48" height="48" style="display:block; margin:0 auto 12px; opacity:0.3;"></iconify-icon>
                <p style="font-size:14px;">No hay sistemas visibles</p>
                <p style="font-size:12px; opacity:0.5;">Activa al menos un sistema en Ajustes</p>
            </div>
        `;
        indicatorsTop.innerHTML = '';
        document.getElementById('infoCard').style.display = 'none';
        return;
    }
    
    document.getElementById('infoCard').style.display = 'flex';
    if (currentIndex >= filteredEmulators.length) currentIndex = 0;
    
    renderCarousel();
    renderIndicators();
    updateInfoCard();
    updateCarouselPosition();
}

// ===== RENDER CARRUSEL =====
function renderCarousel() {
    track.innerHTML = '';
    filteredEmulators.forEach((emu, index) => {
        const item = document.createElement('div');
        item.className = `carousel-item ${index === currentIndex ? 'active' : ''}`;
        item.dataset.index = index;
        item.tabIndex = 0;
        item.setAttribute('role', 'listitem');
        item.setAttribute('aria-label', emu.name);
        
        const wrapper = document.createElement('div');
        wrapper.className = 'emulator-image-wrapper';
        
        const logoDiv = document.createElement('div');
        logoDiv.className = 'emulator-logo-bg';
        
        const img = new Image();
        img.onload = function() {
            logoDiv.style.backgroundImage = `url(${emu.imagePath})`;
            logoDiv.classList.remove('no-logo');
        };
        img.onerror = function() {
            logoDiv.classList.add('no-logo');
            logoDiv.textContent = emu.name;
        };
        img.src = emu.imagePath;
        
        if (img.complete && img.naturalWidth > 0) {
            logoDiv.style.backgroundImage = `url(${emu.imagePath})`;
            logoDiv.classList.remove('no-logo');
        } else if (img.complete && img.naturalWidth === 0) {
            logoDiv.classList.add('no-logo');
            logoDiv.textContent = emu.name;
        }
        
        wrapper.appendChild(logoDiv);
        item.appendChild(wrapper);
        
        const nameSpan = document.createElement('span');
        nameSpan.className = 'emulator-name';
        nameSpan.textContent = emu.name;
        item.appendChild(nameSpan);
        
        const yearSpan = document.createElement('span');
        yearSpan.className = 'emulator-year';
        yearSpan.textContent = emu.year;
        item.appendChild(yearSpan);
        
        // CLIC ÚNICO - Abrir juegos del sistema
        item.addEventListener('click', () => {
            const games = getGamesForSystem(emu.id, emu.listaName);
            if (games && games.length > 0) {
                showGamesList(games, emu.name);
            } else {
                showToast(`No hay juegos disponibles para ${emu.name}`, 'mdi:alert');
            }
        });
        
        // Tecla Enter para abrir juegos
        item.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                const games = getGamesForSystem(emu.id, emu.listaName);
                if (games && games.length > 0) {
                    showGamesList(games, emu.name);
                } else {
                    showToast(`No hay juegos disponibles para ${emu.name}`, 'mdi:alert');
                }
            }
        });
        
        track.appendChild(item);
    });
    updateCarouselPosition();
}

function renderIndicators() {
    indicatorsTop.innerHTML = '';
    filteredEmulators.forEach((_, index) => {
        const dot = document.createElement('button');
        dot.className = `indicator ${index === currentIndex ? 'active' : ''}`;
        dot.setAttribute('role', 'tab');
        dot.setAttribute('aria-label', `Sistema ${index + 1}`);
        dot.addEventListener('click', () => setActiveEmulator(index));
        dot.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                setActiveEmulator(index);
            }
        });
        indicatorsTop.appendChild(dot);
    });
}

function updateInfoCard() {
    if (filteredEmulators.length === 0) return;
    const emu = filteredEmulators[currentIndex];
    systemTitle.textContent = emu.name;
    systemYear.textContent = emu.year;
    systemDesc.textContent = emu.description;
    systemCore.textContent = emu.coreDef;
    controllerIcon.setAttribute('icon', emu.iconController);
    
    systemTags.innerHTML = emu.tags.map(tag => 
        `<span class="tag">${tag}</span>`
    ).join('');
    
    const bgImg = new Image();
    bgImg.onload = function() {
        viewBg.style.backgroundImage = `url(${emu.fondoPath})`;
        viewBg.classList.add('has-image');
    };
    bgImg.onerror = function() {
        viewBg.style.backgroundImage = 'none';
        viewBg.classList.remove('has-image');
        viewBg.style.background = emu.bgColor;
    };
    bgImg.src = emu.fondoPath;
    
    viewBg.classList.add('active');
    setTimeout(() => viewBg.classList.remove('active'), 800);
}

function updateCarouselPosition() {
    const items = document.querySelectorAll('.carousel-item');
    if (!items.length) return;
    
    const containerWidth = document.querySelector('.carousel-container')?.offsetWidth || 400;
    const itemWidth = 156;
    const offset = (containerWidth / 2) - (itemWidth / 2) - (currentIndex * itemWidth);
    const maxOffset = containerWidth - (items.length * itemWidth) - 20;
    const finalOffset = Math.min(Math.max(offset, maxOffset), 20);
    
    track.style.transform = `translateX(${finalOffset}px)`;
    
    items.forEach((item, index) => {
        item.classList.toggle('active', index === currentIndex);
    });
    
    const theme = COLOR_THEMES.find(t => t.id === currentTheme);
    document.querySelectorAll('.indicator').forEach((dot, index) => {
        dot.classList.toggle('active', index === currentIndex);
        if (index === currentIndex && filteredEmulators[currentIndex]) {
            dot.style.background = theme ? theme.color : filteredEmulators[currentIndex].accentColor;
        }
    });
}

function setActiveEmulator(index) {
    if (filteredEmulators.length === 0) return;
    if (index < 0) index = filteredEmulators.length - 1;
    if (index >= filteredEmulators.length) index = 0;
    currentIndex = index;
    updateCarouselPosition();
    updateInfoCard();
}

// ===== GUARDAR CONFIGURACIÓN =====
function saveSettings() {
    const settings = {
        theme: currentTheme,
        systems: emulators.map(emu => ({
            id: emu.id,
            visible: emu.visible !== false
        }))
    };
    localStorage.setItem('retroplay-settings', JSON.stringify(settings));
    hasUnsavedChanges = false;
    showToast('Configuración guardada', 'mdi:check-circle');
    console.log('💾 Configuración guardada:', settings);
}

function loadSettings() {
    try {
        const saved = localStorage.getItem('retroplay-settings');
        if (saved) {
            const settings = JSON.parse(saved);
            if (settings.theme) applyTheme(settings.theme);
            if (settings.systems) {
                settings.systems.forEach(savedEmu => {
                    const emu = emulators.find(e => e.id === savedEmu.id);
                    if (emu) emu.visible = savedEmu.visible;
                });
            }
            console.log('📂 Preferencias cargadas');
            return true;
        }
    } catch (e) {
        console.warn('⚠️ Error cargando preferencias:', e);
    }
    return false;
}

function resetSettings() {
    emulators.forEach(emu => emu.visible = emu.isRetroArch);
    applyTheme('purple');
    hasUnsavedChanges = true;
    renderSystemsList();
    renderColorThemes();
    filterAndRender();
    showToast('Preferencias restablecidas', 'mdi:refresh');
}

// ===== STATUS WIDGET =====
function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    clockDisplay.innerHTML = `${hours}:${minutes} <span class="seconds">${seconds}</span>`;
}

function updateBattery() {
    if ('getBattery' in navigator) {
        navigator.getBattery().then(battery => {
            const level = Math.round(battery.level * 100);
            const charging = battery.charging;
            
            batteryPercentage.textContent = `${level}%`;
            
            let iconName = 'mdi:battery-';
            if (charging) iconName += 'charging-';
            
            if (level >= 90) iconName += '90';
            else if (level >= 80) iconName += '80';
            else if (level >= 60) iconName += '60';
            else if (level >= 50) iconName += '50';
            else if (level >= 40) iconName += '40';
            else if (level >= 30) iconName += '30';
            else if (level >= 20) iconName += '20';
            else if (level >= 10) iconName += '10';
            else iconName += 'outline';
            
            if (charging) iconName += '-outline';
            
            batteryIcon.setAttribute('icon', iconName);
            batteryIcon.className = `battery-icon ${charging ? 'charging' : (level <= 15 ? 'low' : level <= 30 ? 'medium' : 'high')}`;
        }).catch(() => {
            batteryPercentage.textContent = '--%';
        });
    } else {
        batteryPercentage.textContent = '--%';
    }
}

function updateConnection() {
    if ('connection' in navigator) {
        const conn = navigator.connection;
        if (conn) {
            const type = conn.effectiveType || 'unknown';
            
            if (type === 'wifi' || type === 'ethernet') {
                networkType.innerHTML = `<iconify-icon icon="mdi:wifi" width="12" height="12"></iconify-icon>`;
            } else if (type === 'cellular' || type === '4g' || type === '3g' || type === '2g') {
                networkType.innerHTML = `<iconify-icon icon="mdi:signal-cellular-3" width="12" height="12"></iconify-icon>`;
            } else {
                networkType.innerHTML = `<iconify-icon icon="mdi:lan-disconnect" width="12" height="12"></iconify-icon>`;
            }
            
            const bars = signalBars.querySelectorAll('.bar');
            const speeds = { 'slow-2g': 1, '2g': 1, '3g': 2, '4g': 3, 'wifi': 4, 'ethernet': 4 };
            const activeBars = speeds[type] || 2;
            bars.forEach((bar, i) => {
                bar.classList.toggle('active', i < activeBars);
                bar.classList.toggle('inactive', i >= activeBars);
            });
        }
    } else {
        networkType.innerHTML = `<iconify-icon icon="mdi:wifi" width="12" height="12"></iconify-icon>`;
        signalBars.querySelectorAll('.bar').forEach((bar, i) => {
            bar.classList.toggle('active', i < 3);
            bar.classList.toggle('inactive', i >= 3);
        });
    }
}

function initStatusWidget() {
    updateClock();
    updateBattery();
    updateConnection();
    setInterval(updateClock, 1000);
    setInterval(updateBattery, 30000);
    if ('connection' in navigator) {
        navigator.connection?.addEventListener('change', updateConnection);
    }
}

// ===== NAVEGACIÓN =====
menuBtn?.addEventListener('click', showSettings);
settingsBack?.addEventListener('click', showHome);
gamesBack?.addEventListener('click', goHomeFromGames);
btnSelectFolder?.addEventListener('click', selectFolder);
btnScanListas?.addEventListener('click', scanListas);

saveSettingsBtn?.addEventListener('click', () => {
    saveSettings();
    filterAndRender();
});

resetSettingsBtn?.addEventListener('click', () => {
    if (confirm('¿Restablecer todas las preferencias a los valores predeterminados?')) {
        resetSettings();
    }
});

// ===== KEYBOARD =====
document.addEventListener('keydown', (e) => {
    if (settingsOpen) {
        if (e.key === 'Escape') showHome();
        if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            saveSettings();
            filterAndRender();
        }
        return;
    }
    
    if (modalOverlay.classList.contains('open')) {
        if (e.key === 'Escape') closeGameModal();
        return;
    }
    
    if (e.target.closest('input') || e.target.closest('textarea')) return;
    
    const activeElement = document.activeElement;
    const isOnCarousel = activeElement?.closest('.carousel-item');
    const isOnIndicator = activeElement?.closest('.indicator');
    
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (isOnCarousel || isOnIndicator) setActiveEmulator(currentIndex - 1);
    } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        if (isOnCarousel || isOnIndicator) setActiveEmulator(currentIndex + 1);
    } else if (e.key === 'Home') {
        e.preventDefault();
        setActiveEmulator(0);
    } else if (e.key === 'End') {
        e.preventDefault();
        setActiveEmulator(filteredEmulators.length - 1);
    }
});

// ===== GAMEPAD =====
let gamepadIndex = null;

function handleGamepad() {
    if (settingsOpen || isGameViewOpen) return;
    const gamepads = navigator.getGamepads();
    const gamepad = gamepads[gamepadIndex] || gamepads[0];
    if (!gamepad) return;
    
    const axisThreshold = 0.5;
    const leftStickX = gamepad.axes[0] || 0;
    const rightStickX = gamepad.axes[2] || 0;
    const dPadX = gamepad.buttons[14]?.pressed ? -1 : gamepad.buttons[15]?.pressed ? 1 : 0;
    
    let direction = 0;
    if (dPadX !== 0) direction = dPadX;
    else if (Math.abs(leftStickX) > axisThreshold) direction = leftStickX > 0 ? 1 : -1;
    else if (Math.abs(rightStickX) > axisThreshold) direction = rightStickX > 0 ? 1 : -1;
    
    if (direction !== 0) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < filteredEmulators.length && newIndex !== currentIndex) {
            setActiveEmulator(newIndex);
            setTimeout(() => {}, 300);
        }
    }
}

function initGamepad() {
    window.addEventListener('gamepadconnected', (e) => {
        gamepadIndex = e.gamepad.index;
        console.log('🎮 Gamepad conectado:', e.gamepad.id);
    });
    window.addEventListener('gamepaddisconnected', () => {
        console.log('🎮 Gamepad desconectado');
    });
    function gamepadLoop() {
        if (navigator.getGamepads().some(g => g)) handleGamepad();
        requestAnimationFrame(gamepadLoop);
    }
    gamepadLoop();
}

// ===== DRAG / SWIPE =====
let touchStartX = 0;
let isSwiping = false;

track.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    isSwiping = false;
}, { passive: true });

track.addEventListener('touchmove', (e) => {
    if (settingsOpen || !filteredEmulators.length) return;
    if (!touchStartX) return;
    const diffX = e.touches[0].clientX - touchStartX;
    if (Math.abs(diffX) > 10) {
        isSwiping = true;
        e.preventDefault();
    }
}, { passive: false });

track.addEventListener('touchend', (e) => {
    if (!touchStartX || !isSwiping || !filteredEmulators.length) {
        touchStartX = 0;
        return;
    }
    const diff = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(diff) > 50) {
        setActiveEmulator(diff < 0 ? currentIndex + 1 : currentIndex - 1);
    }
    touchStartX = 0;
    isSwiping = false;
}, { passive: true });

track.addEventListener('mousedown', (e) => {
    if (settingsOpen || !filteredEmulators.length) return;
    isDragging = true;
    startX = e.clientX;
    track.style.transition = 'none';
});

document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
});

document.addEventListener('mouseup', (e) => {
    if (!isDragging || !filteredEmulators.length) return;
    isDragging = false;
    track.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
    const diff = e.clientX - startX;
    if (Math.abs(diff) > 50) {
        setActiveEmulator(diff < 0 ? currentIndex + 1 : currentIndex - 1);
    } else {
        updateCarouselPosition();
    }
});

// ===== INIT =====
async function init() {
    console.log('🚀 RetroPlay - Juegos reales desde listas');
    
    try {
        const rawData = await loadSystemConfig();
        emulators = processEmulators(rawData);
        if (!emulators.length) throw new Error('No hay sistemas');
        
        emuladoresData = await loadEmuladores();
        
        const hasSaved = loadSettings();
        if (!hasSaved) {
            emulators.forEach(emu => emu.visible = emu.isRetroArch);
        }
        
        scanListas();
        
        filterAndRender();
        setTimeout(updateCarouselPosition, 300);
        
        if (navigator.getGamepads) initGamepad();
        initStatusWidget();
        
        console.log(`✅ ${emulators.length} sistemas (${filteredEmulators.length} visibles)`);
        console.log(`📦 ${emuladoresData.length} emuladores disponibles`);
        console.log(`📋 ${listasData.length} listas de juegos cargadas`);
        console.log('🎮 Clic en sistema → abre sus juegos reales');
        console.log('🖱️ Click largo en juego → modal de edición');
        
    } catch (error) {
        console.error('❌ Error:', error);
        const container = document.querySelector('.app-container');
        if (container) {
            container.innerHTML = `
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:30px;text-align:center;">
                    <iconify-icon icon="mdi:alert-circle" width="64" height="64" style="color:#e74c3c;margin-bottom:20px;"></iconify-icon>
                    <h2 style="color:#f0f0f5;font-size:20px;margin-bottom:12px;">Error al cargar los datos</h2>
                    <p style="color:#8888a0;font-size:14px;max-width:300px;margin-bottom:20px;">${error.message}</p>
                    <button onclick="location.reload()" style="padding:12px 40px;border-radius:12px;border:none;background:#6c5ce7;color:white;font-weight:600;cursor:pointer;">Reintentar</button>
                </div>
            `;
        }
    }
}

let resizeTimeout;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
        if (filteredEmulators.length) updateCarouselPosition();
    }, 200);
});

document.addEventListener('touchmove', (e) => {
    const target = e.target;
    if (target.closest('.app-container') && !target.closest('.view-settings') && !target.closest('.view-games')) {
        e.preventDefault();
    }
}, { passive: false });

document.addEventListener('DOMContentLoaded', init);
</script>
